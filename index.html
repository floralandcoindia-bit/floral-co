<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#101A16" />
    <meta name="description" content="Thoughtfully handcrafted creations, made to turn everyday moments into something special." />
    <link rel="icon" type="image/svg+xml" href="/assets/branding/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Hanken+Grotesk:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>html,body{margin:0;padding:0;background:#101a16;color:#f3ede0}#root{background:#101a16}*{box-sizing:border-box}</style>
    <title>Floral &amp; Co</title>
  </head>
  <body>
    <div id="root">
      <!-- Intentionally empty: the page is already dark green, and the animated loader appears as soon as the app starts. -->
      <div id="boot"></div>
    </div>
    <script>
      // If the app has not started after 10s (very old browser / blocked script), show a helpful message instead of a blank screen.
      setTimeout(function () {
        var b = document.getElementById("boot");
        if (b) b.innerHTML = '<div style="text-align:center;padding:24px;font-size:18px">Floral &amp; Co<br><span style="font-size:14px;opacity:.75;font-family:sans-serif">Still loading… if this stays, please update your browser or open this link in Chrome / Safari.</span></div>';
      }, 10000);
    </script>
    <noscript>This site needs JavaScript to run. Please enable it and reload.</noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
